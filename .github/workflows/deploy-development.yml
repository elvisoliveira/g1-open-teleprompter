# Development deployment: debug APK that loads JS from a local Metro server.
# It only needs rebuilding when the native side changes (android/, dependencies,
# app config) — day-to-day TS/TSX work is served live by Metro.
#
# Local workflow after installing the APK on the phone:
#   adb reverse tcp:8081 tcp:8081
#   npx expo start
# then open the app — it connects to the local Metro.
name: Deploy Development

on:
  workflow_dispatch:
  push:
    branches: [master, simplify]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - '.github/workflows/deploy-development.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      - run: ./gradlew :app:assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
